name: Backend Build and Deploy

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: applianceslkdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }} \
            -t applianceslkdevacr.azurecr.io/backend-app:dev \
            .

      - name: Push backend image
        run: |
          docker push applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }}
          docker push applianceslkdevacr.azurecr.io/backend-app:dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group rg-appliances-dev \
            --name appliances-api-dev \
            --image applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }}

      - name: Show deployed image
        run: |
          az containerapp show \
            --resource-group rg-appliances-dev \
            --name appliances-api-dev \
            --query "properties.template.containers[0].image" \
            --output tsv
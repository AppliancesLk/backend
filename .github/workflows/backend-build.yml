name: Backend Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: applianceslkdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }} \
            -t applianceslkdevacr.azurecr.io/backend-app:dev \
            .

      - name: Push backend image
        run: |
          docker push applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }}
          docker push applianceslkdevacr.azurecr.io/backend-app:dev
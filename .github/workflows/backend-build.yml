name: Backend CI and Deploy

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # QUALITY GATE
  # =========================================================
  quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appliances_lk_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d appliances_lk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: test
      DB_PASSWORD: test
      DB_NAME: appliances_lk_test
      DB_SSL: false
      JWT_SECRET: test-ci-secret
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov:unit

      - name: Build backend
        run: npm run build

      - name: Run database migrations
        run: npm run migration:run

      - name: Run Jest integration tests
        run: npm run test:integration:jest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  # =========================================================
  # SECURITY SCAN
  # =========================================================
  security-scan:
    name: Backend Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high

  # =========================================================
  # BUILD + DEPLOY
  # =========================================================
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - quality
      - security-scan

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: applianceslkdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }} \
            -t applianceslkdevacr.azurecr.io/backend-app:dev \
            .

      - name: Push backend image
        run: |
          docker push applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }}
          docker push applianceslkdevacr.azurecr.io/backend-app:dev

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group rg-appliances-dev \
            --name appliances-api-dev \
            --image applianceslkdevacr.azurecr.io/backend-app:${{ github.sha }}

      - name: Show deployed image
        run: |
          az containerapp show \
            --resource-group rg-appliances-dev \
            --name appliances-api-dev \
            --query "properties.template.containers[0].image" \
            --output tsv
